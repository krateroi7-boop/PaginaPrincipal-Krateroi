# helmet cubre las respuestas del backend, pero esas cabeceras no llegan
# al HTML: eso lo sirve nginx. Van acá y se incluyen en cada location que
# sirve el sitio, no a nivel de server, porque nginx las heredaría hacia
# /api/ y saldrían duplicadas y en conflicto con las de helmet.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Vacía bajo HTTP —el navegador la ignoraría igual y sólo dejaría un
# aviso en consola—, con valor bajo HTTPS. nginx omite la cabecera
# cuando el valor queda vacío.
add_header Cross-Origin-Opener-Policy $coop always;

# Generada en el build a partir del HTML compilado (ver generar-csp.mjs).
include /etc/nginx/snippets/csp.conf;
