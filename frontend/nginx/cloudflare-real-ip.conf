# Recuperación de la IP real del visitante cuando el sitio está detrás
# de Cloudflare.
#
# Sin esto, cuando se active el proxy de Cloudflare todas las peticiones
# llegarían con la IP del borde de Cloudflare y el límite por IP volvería
# a agrupar a visitantes distintos en el mismo contador —el mismo
# problema que ya se corrigió para nginx, una capa más arriba.
#
# `real_ip_header CF-Connecting-IP` es lo que recomienda Cloudflare:
# trae una sola dirección, mientras que X-Forwarded-For puede venir con
# una lista de largo variable.
#
# La cabecera SÓLO se obedece si la conexión viene de uno de los rangos
# de abajo. Eso es lo que impide falsificarla: cualquiera puede mandar
# CF-Connecting-IP, pero desde una IP que no sea de Cloudflare, nginx la
# ignora. Por lo mismo, el cortafuegos de la VPS debería aceptar el
# puerto 80 sólo desde estos rangos una vez que Cloudflare esté delante:
# si el origen sigue siendo alcanzable por su IP, se puede saltar tanto
# Cloudflare como el límite por IP.
#
# Mientras NO haya Cloudflare, este archivo no hace nada: las peticiones
# llegan desde direcciones que no están en la lista y nginx conserva la
# IP real del visitante tal cual.
#
# Rangos publicados en https://www.cloudflare.com/ips-v4 y /ips-v6.
# Cambian muy de vez en cuando; conviene revisarlos al renovar el
# despliegue.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
