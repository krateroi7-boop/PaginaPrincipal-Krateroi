# Sitio y backend bajo el mismo origen HTTP.
#
# El navegador pide http://<vps>/ y recibe el sitio; pide
# http://<vps>/api/... y nginx lo entrega al contenedor del backend por
# la red interna de Docker. Para el navegador es una sola dirección, así
# que no hay petición entre orígenes: CORS no llega a intervenir.

# Esquema real con el que el visitante llegó. Detrás de Cloudflare la
# conexión hasta nginx puede ser HTTP aunque el visitante use HTTPS, y
# eso lo dice X-Forwarded-Proto; sin proxy delante, vale $scheme.
map $http_x_forwarded_proto $esquema_visitante {
    default   $scheme;
    "~^https$" https;
    "~^http$"  http;
}

# COOP la ignora el navegador si el origen no es seguro, y deja un aviso
# en la consola de cada visita. Se emite sólo bajo HTTPS: hoy no sale, y
# el día que haya dominio con TLS aparece sola. nginx omite por completo
# una cabecera cuyo valor queda vacío.
map $esquema_visitante $coop {
    https   "same-origin";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Las cabeceras de seguridad NO van en este nivel: nginx las heredaría
    # hacia /api/, donde helmet ya pone las suyas, y saldrían duplicadas y
    # en conflicto. Van una por una en las location que sirven el sitio.

    # El formulario y el asistente mandan JSON corto; nada sube archivos.
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── El backend, bajo el mismo origen ──
    location /api/ {
        # El nombre va en una variable a propósito. Con `proxy_pass
        # http://backend;` —o con un bloque upstream— nginx resuelve el
        # nombre una sola vez, al cargar la configuración, y se queda con
        # esa IP: el día que se redespliega el backend y Docker le asigna
        # otra dirección, nginx sigue apuntando a la vieja y el formulario
        # y el asistente devuelven 502 indefinidamente aunque el backend
        # esté sano. Con la variable, nginx vuelve a resolver el nombre
        # contra el DNS interno de Docker (127.0.0.11) cada vez.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_host backend;
        proxy_pass http://$backend_host:3000$request_uri;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # $remote_addr y no $proxy_add_x_forwarded_for: con el módulo
        # real_ip de arriba, $remote_addr ya es el visitante verdadero
        # —venga de Cloudflare o directo— y mandar sólo esa dirección
        # descarta cualquier cadena que el cliente haya inventado. El
        # backend confía en un salto (nginx) y toma esta dirección, sin
        # depender de cuántos proxies haya delante.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $esquema_visitante;
        proxy_set_header X-Forwarded-Host  $host;

        # El asistente tarda entre 21 y 28 s medidos, y el backend se da
        # un techo de 75 s con reintentos incluidos. El proxy tiene que
        # aguantar algo más que ese techo, y el frontend algo más que el
        # proxy: 75 s (backend) < 85 s (acá) < 90 s (navegador). Todo
        # por debajo de los 100 s a los que Cloudflare corta con un 524.
        proxy_connect_timeout 3s;
        proxy_send_timeout    85s;
        proxy_read_timeout    85s;

        # Un error del backend es del backend: su cuerpo lleva el motivo
        # que el frontend muestra, y no debe reemplazarse por el HTML de
        # error de nginx.
        proxy_intercept_errors off;

        # Acá NO se incluyen las cabeceras de seguridad: helmet ya las
        # pone en cada respuesta del backend, y volver a agregarlas las
        # mandaba duplicadas y con valores en conflicto (X-Frame-Options
        # SAMEORIGIN de helmet contra DENY de nginx).
    }

    # ── Sitio estático ──

    # Los nombres de assets llevan hash: el contenido no cambia nunca
    # bajo el mismo nombre.
    location /assets/ {
        # Un solo Cache-Control: `expires` emite el suyo, así que el valor
        # completo va en el add_header y no se duplica la cabecera.
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        access_log off;
    }

    # No es una SPA: son dos páginas reales. /terminos sirve
    # terminos.html, y lo que no exista es 404 y no la portada.
    location / {
        try_files $uri $uri.html $uri/ =404;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
    }

    # El HTML es el que apunta a los assets con hash: si se cachea, el
    # despliegue siguiente no se ve.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
    }
}
